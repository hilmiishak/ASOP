version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asop_user
      POSTGRES_PASSWORD: asop_password
      POSTGRES_DB: asop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asop_user -d asop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: asop-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://asop_user:asop_password@db:5432/asop_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: asop-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
